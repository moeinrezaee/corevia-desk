---
kind: fork
repo:
  type: fork
  slug: desk
  name: Corevia Desk
  local:
    path: corevia-desk
  gitlab:
    group_path: corevia/fork
    path: corevia-desk
    name: Corevia Desk
  visibility: private
  branches:
    default: main
    develop: develop
    protected:
      - main
      - upstream
source:
  mode: source-fork
  source_of_truth: corevia/fork/corevia-desk
  fork_contract: .corevia/fork.yaml
  upstream: https://github.com/rustdesk/rustdesk.git
automation:
  bridge_usecase: source-fork
  apply_policy: bridge-only
verification:
  level: full
  testspec:
    mode: required
