surgical:
- path: ".gitignore"
  reason: Ignore OS, editor and local-environment files and the generated WebView/Nuxt
    outputs Corevia Desk adds.
  owner: platform-engineering
- path: AGENTS.md
  reason: Corevia Desk delivery lock and agent rules layered on top of the upstream
    agent guidance.
  owner: platform-engineering
- path: Cargo.lock
  reason: Dependency lock for the Corevia additions (WebView host, fonts, MCP bridge).
    After an upstream merge take upstream's file and regenerate with cargo instead
    of resolving by hand.
  owner: platform-engineering
- path: Cargo.toml
  reason: Adds the Corevia dependencies, product description and the corevia-customer-support
    feature.
  owner: platform-engineering
- path: README.md
  reason: Corevia Desk product README replacing the upstream project README.
  owner: platform-engineering
- path: build.py
  reason: Build profiles (full-desk, customer-support) and the Corevia Desk Windows
    binary name.
  owner: platform-engineering
- path: build.rs
  reason: Version generation from COREVIA_DESK_VERSION for reproducible Corevia releases.
  owner: platform-engineering
- path: docs/CONTRIBUTING-IT.md
  reason: Corevia Desk wording in the contributing guide translation.
  owner: platform-engineering
- path: docs/README-FA.md
  reason: Persian README for Corevia Desk replacing the upstream Persian README.
  owner: platform-engineering
- path: flutter/lib/mobile/pages/home_page.dart
  reason: Uses the Corevia URI prefix when building share links.
  owner: platform-engineering
- path: flutter/lib/web/bridge.dart
  reason: Treats Corevia Desk as the default full-capability profile when detecting
    custom clients.
  owner: platform-engineering
- path: libs/clipboard/build.rs
  reason: Cross-compilation support for the Windows clipboard library (COREVIA_CROSS_AR)
    and early return on other targets.
  owner: platform-engineering
- path: libs/clipboard/src/windows/wf_cliprdr.c
  reason: Checks PostMessage results in the Windows clipboard redirector so failed
    deliveries are noticed.
  owner: platform-engineering
- path: libs/scrap/build.rs
  reason: Falls back to the distribution libyuv package when pkg-config cannot find
    it (Debian builds).
  owner: platform-engineering
- path: libs/scrap/src/common/quartz.rs
  reason: macOS screen-recording permission check without showing a prompt, resolved
    at runtime for older deployment targets.
  owner: platform-engineering
- path: src/client.rs
  reason: Diagnostics for the Corevia native client secure handshake.
  owner: platform-engineering
- path: src/client/io_loop.rs
  reason: Diagnostics for login challenge, response and peer-info stages of the native
    client.
  owner: platform-engineering
- path: src/clipboard.rs
  reason: macOS pasteboard change tracking for clipboard synchronisation.
  owner: platform-engineering
- path: src/common.rs
  reason: Initialises the Corevia application identity at startup.
  owner: platform-engineering
- path: src/core_main.rs
  reason: Adds the --corevia-mcp-bridge mode so a headless user-side connection manager
    can ask for approval.
  owner: platform-engineering
- path: src/flutter_ffi.rs
  reason: FFI entry points for the Corevia WebView host and bridge (see src/corevia_bridge.rs).
  owner: platform-engineering
- path: src/ipc.rs
  reason: Backward-compatible serde defaults for new IPC fields.
  owner: platform-engineering
- path: src/lib.rs
  reason: Declares the Corevia modules (branding, ACL, bridge, WebView, single instance).
  owner: platform-engineering
- path: src/main.rs
  reason: Single-instance guard for the native launcher.
  owner: platform-engineering
- path: src/platform/delegate.rs
  reason: macOS reopen handling for the Corevia Desk dock icon.
  owner: platform-engineering
- path: src/platform/macos.rs
  reason: Corevia bundle identity and name handling on macOS.
  owner: platform-engineering
- path: src/platform/windows.rs
  reason: Stable Windows service identifier and coexistence of the full-desk and customer-support
    profiles.
  owner: platform-engineering
- path: src/server.rs
  reason: Diagnostics for the secure handshake on the host side.
  owner: platform-engineering
- path: src/server/connection.rs
  reason: Corevia access-control and approval hooks on incoming connections.
  owner: platform-engineering
- path: src/service.rs
  reason: Initialises the application identity in the service process.
  owner: platform-engineering
- path: src/tray.rs
  reason: Uses the native tray asset instead of loading a Flutter asset at runtime.
  owner: platform-engineering
- path: src/ui.rs
  reason: Hosts the Corevia WebView user interface in place of the upstream Sciter/Flutter
    entry points.
  owner: platform-engineering
- path: src/ui/remote.rs
  reason: Remote-session handling adjustments for the Corevia WebView user interface.
  owner: platform-engineering
- path: src/ui_cm_interface.rs
  reason: Connection-manager interface hooks for the Corevia WebView connection manager.
  owner: platform-engineering
- path: src/ui_interface.rs
  reason: UI interface additions consumed by the Corevia WebView host.
  owner: platform-engineering
- path: src/ui_session_interface.rs
  reason: Session routing diagnostics (connection type, file transfer, displays) for
    the native session.
  owner: platform-engineering
