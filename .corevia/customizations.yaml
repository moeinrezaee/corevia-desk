# Every Corevia Desk difference from RustDesk that is not an additive file.
# mechanical: regenerated by .corevia/branding/apply.sh after each sync (never resolved by hand).
# surgical:   small reasoned edits to upstream files (limit: customizations.surgical_max_files in fork.yaml).
mechanical:
- id: branding
  script: ".corevia/branding/apply.sh"
  description: 'Application identity: names, bundle/package ids, platform shells and
    icons. Regenerated from .corevia/branding/manifest.json.'
  paths:
  - flutter/README.md
  - flutter/android/app/build.gradle
  - flutter/android/app/src/debug/AndroidManifest.xml
