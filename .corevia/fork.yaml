---
kind: source-fork
version: 1
fork:
  slug: desk
  name: Corevia Desk
  decision: live-fork
  decision_reason: Corevia Desk tracks RustDesk master. Corevia work is mostly additive
    (WebView host, bridge, web UI); 81 branding paths are regenerated by a script
    and 36 upstream files carry reasoned edits.
upstream:
  name: RustDesk
  url: https://github.com/rustdesk/rustdesk.git
  default_branch: master
  track: default-branch
  licenses:
  - AGPL-3.0
repo:
  group_path: corevia/fork
  path: corevia-desk
  local_path: corevia-desk
  visibility: private
branches:
  mirror: upstream
  integration: develop
  release: main
  protected:
  - upstream
  - main
sync:
  cadence: weekly
  strategy: merge
  sync_branch_prefix: sync/
  max_minutes_per_sync: 90
  max_conflict_files: 30
customizations:
  registry: ".corevia/customizations.yaml"
  additive_paths:
  - corevia/**
  - ".corevia/**"
  - docs/corevia/**
  - web/**
  - mcp/**
  - docs/specs/**
  - docs/contracts/**
  - docs/standards/**
  - docs/roadmaps/**
  - docs/operations/**
  - docs/AGENTS.md
  - docs/INDEX.md
  - docs/INDEX.fa.md
  - docs/incidents/**
  - docs/handoff/**
  - docs/decisions/**
  - scripts/ci/**
  - release/**
  - libs/machine-uid/**
  - src/branding.rs
  - src/corevia_acl.rs
  - src/corevia_bridge.rs
  - src/single_instance.rs
  - src/webview.rs
  - src/webview_cm.rs
  - src/webview_session.rs
  - res/corevia-icon.svg
  - res/corevia-tray.svg
  surgical_max_files: 40
  commit_prefix: "[corevia]"
  untouchable_paths:
  - LICENSE
  - LICENCE
  - AUTHORS
  - LICENSES/**
  - "**/LICENSE"
  - "**/LICENCE"
  - CODE_OF_CONDUCT.md
  branding_script: ".corevia/branding/apply.sh"
publication:
  github:
    enabled: true
    repo: moeinrezaee/corevia-desk
    refs:
    - release
    - tags
    intake:
      enabled: true
      target_branch: develop
      require_license_agreement: true
  leak_scan:
    allow:
    - path: src/common.rs
      kinds:
      - private-ipv4
      reason: Private-range addresses are unit-test fixtures for the public-address
        check, not Corevia infrastructure.
    - path: src/server/connection.rs
      kinds:
      - private-ipv4
      reason: A private-range address is a unit-test fixture for port-forward scoping,
        not Corevia infrastructure.
ci:
  upstream_release_workflows: disabled
